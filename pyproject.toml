[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymcsc"
version = "0.2.0"
description = "Create, run and manage Minecraft servers (Vanilla, Paper, Forge) from Python"
authors = [{ name = "ddavidel" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["requests", "psutil", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcsc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
